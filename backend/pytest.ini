[tool:pytest]
# Pytest configuration for Reviews Copilot backend tests
minversion = 6.0
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    ai: marks tests that use AI features (may be slow due to model loading)
    
# Test discovery patterns
filterwarnings =
    ignore::DeprecationWarning:transformers.*
    ignore::FutureWarning:huggingface_hub.*
    ignore::DeprecationWarning:.*regex.*